plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.juggle.im.app.android'
    compileSdk 34

    defaultConfig {
        applicationId "com.juggle.im.android"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        namespace "com.juggle.im.android"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        baseline = file("lint-baseline.xml")
    }

}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.androidx.swiperefreshlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation "androidx.multidex:multidex:2.0.1"

    implementation libs.androidx.appcompat.v142
    implementation libs.google.material.v161
    implementation libs.androidx.constraintlayout
    implementation 'androidx.recyclerview:recyclerview:1.3.0'

    // 生命周期组件
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.1'
    implementation("org.greenrobot:eventbus:3.3.1")

    // 依赖注入
    implementation libs.dagger.hilt.android
    annotationProcessor libs.dagger.hilt.compiler

    // 图片加载
    implementation libs.github.glide
    annotationProcessor libs.glide.compiler

    // pinch-to-zoom image view for preview (fallback alternative)
    // pinch-to-zoom image view for preview
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    // 网络
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"

    implementation "com.google.zxing:core:3.3.2"


    // juggleim
    implementation 'com.juggle.im:juggle:1.8.27.1'
    implementation 'org.java-websocket:Java-WebSocket:1.5.5'
    implementation 'com.google.protobuf:protobuf-javalite:3.18.0'
    implementation 'com.qiniu:qiniu-android-sdk:8.7.0'
}