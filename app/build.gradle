plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.juggle.im.app.android'
    compileSdk 34

    defaultConfig {
        applicationId "com.juggle.im.android"
        minSdk 24
        targetSdk 34
        versionCode 142
        versionName "1.4.2"
        multiDexEnabled true
        namespace "com.juggle.im.android"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            storeFile file("../keystore/key.keystore")
            storePassword "juggleim"
            keyAlias "juggleim"
            keyPassword "juggleim"
        }

        debug {
            storeFile file("../keystore/key.keystore")
            storePassword "juggleim"
            keyAlias "juggleim"
            keyPassword "juggleim"
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        baseline = file("lint-baseline.xml")
    }

}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.androidx.swiperefreshlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation "androidx.multidex:multidex:2.0.1"

    implementation libs.androidx.appcompat.v142
    implementation libs.google.material.v161
    implementation libs.androidx.constraintlayout
    implementation 'androidx.recyclerview:recyclerview:1.3.0'

    // 生命周期组件
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.1'
    implementation("org.greenrobot:eventbus:3.3.1")

    // 依赖注入
    implementation libs.dagger.hilt.android
    annotationProcessor libs.dagger.hilt.compiler

    // 图片加载
    implementation libs.github.glide
    annotationProcessor libs.glide.compiler

    // pinch-to-zoom image view for preview (fallback alternative)
    // pinch-to-zoom image view for preview
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'

    // 网络
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"

    implementation "com.google.zxing:core:3.3.2"
    implementation "androidx.security:security-crypto:1.0.0"

    // CameraX + ML Kit 条码扫描
    implementation "androidx.camera:camera-core:1.3.1"
    implementation "androidx.camera:camera-camera2:1.3.1"
    implementation "androidx.camera:camera-lifecycle:1.3.1"
    implementation "androidx.camera:camera-view:1.3.1"
    implementation "com.google.mlkit:barcode-scanning:17.2.0"


    // JuggleIM（版本以官方 Maven 仓库已发布版本为准）
    implementation 'com.juggle.im:juggle:1.9.1'
    implementation 'org.java-websocket:Java-WebSocket:1.5.5'
    implementation 'com.google.protobuf:protobuf-javalite:3.18.0'
    implementation 'com.qiniu:qiniu-android-sdk:8.7.0'

    // 音视频（ZEGO 版本与最新已发布的 Juggle ZEGO Call 组件保持配套）
    implementation 'com.juggle.call.zego:juggle:1.8.46'
    implementation 'im.zego:express-video:3.21.0'

    // Markdown 渲染（用于 AI 流式文本消息）
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:linkify:4.6.2'

}
